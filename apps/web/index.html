<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CivicAI - AI Civic Incident Capture &amp; Geospatial Command Center</title>
  <meta name="description"
    content="Realtime AI-assisted civic incident capture, geospatial telemetry mapping, and municipal authority response hub." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Google Maps JavaScript API -->
  <script>
    window.__gmapsReady = false;
    window.initGoogleMap = function () { window.__gmapsReady = true; window.dispatchEvent(new Event('gmaps:ready')); };
    // Google calls this when it rejects the key (bad key, referrer not allowed, API not enabled, billing off).
    window.gm_authFailure = function () { window.__gmapsAuthFailed = true; window.dispatchEvent(new Event('gmaps:authfailure')); };
  </script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD9OqbVgibXD6UuDEw19mbE4zrdWHHazNA&callback=initGoogleMap&libraries=marker"
    async defer
    onerror="window.__gmapsLoadFailed = true; window.dispatchEvent(new Event('gmaps:loaderror'));"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
